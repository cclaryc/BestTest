[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "besttest-analysis"
version = "0.1.0"
description = "Static analysis core of BestTest: maps a diff to the functions, methods and classes it changes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "unidiff>=0.7.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
besttest-analysis = "analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "unidiff.*"
ignore_missing_imports = true
