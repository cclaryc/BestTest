# Move this file to .github/workflows/analysis.yml to activate it.
name: analysis

on:
  push:
    branches: [main]
    paths: ["analysis/**", ".github/workflows/analysis.yml"]
  pull_request:
    paths: ["analysis/**", ".github/workflows/analysis.yml"]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: analysis/requirements-dev.lock
      # The lock file pins every tool, so a new release cannot break the build.
      - run: python -m pip install -e ".[dev]" -c requirements-dev.lock
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m analysis.api.openapi --check
      - run: python -m pytest

  image:
    name: container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag besttest-analysis:ci analysis
      - name: Start the service with the example as its snapshots
        run: >
          docker run --detach --name analysis
          --read-only --cap-drop ALL --security-opt no-new-privileges
          --volume "$PWD/analysis/examples/discount:/snapshots:ro"
          --publish 127.0.0.1:8000:8000
          besttest-analysis:ci
      - name: Call it and check the answer
        run: python3 analysis/scripts/smoke.py http://127.0.0.1:8000
      - name: Container must report healthy
        run: |
          for attempt in $(seq 1 15); do
            status=$(docker inspect --format '{{.State.Health.Status}}' analysis)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "container health: $status" && exit 1
      - if: always()
        run: docker logs analysis
