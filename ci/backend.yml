# Move this file to .github/workflows/backend.yml to activate it.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "analysis/openapi.json"
      - "analysis/examples/**"
      - "compose.yaml"
      - "scripts/smoke_stack.py"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "analysis/openapi.json"
      - "analysis/examples/**"
      - "compose.yaml"
      - "scripts/smoke_stack.py"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    name: unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      # The same command a developer runs: Gradle in a container, against a
      # throwaway PostgreSQL.
      - run: docker compose --profile test run --rm backend-test

  stack:
    name: whole stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --detach
      - name: Follow one analysis through every service
        run: python3 scripts/smoke_stack.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
